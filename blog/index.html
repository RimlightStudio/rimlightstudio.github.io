---
layout: default
title: 개발일지
---
<main class="wrap">
  <h1>개발일지</h1>
  <p class="lead">&lt;전력재판 : 육도윤회&gt; 개발일지를 올립니다. 매월 1회 + 필요할 때.</p>
  <ul class="posts">
  {% for post in site.posts %}
    <li><a href="{{ site.baseurl }}{{ post.url }}"><span class="d">{{ post.date | date: "%Y.%m.%d %H:%M" }}</span><span class="t">{{ post.title }}</span></a></li>
  {% endfor %}
  </ul>
  {% if site.posts.size == 0 %}<p class="lead">첫 글 준비 중.</p>{% endif %}
</main>
