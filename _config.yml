# 전력재판 : 육도윤회 공식 사이트 (GitHub Pages · Jekyll 내장 빌드 — 로컬 설치 불필요)
title: "전력재판 : 육도윤회"
description: 인간이 멸망한 세계, 최후의 인간이 멸망의 죄인을 심판한다 — Rimlight Studio 개발일지
lang: ko
url: "https://rim-light.com"
baseurl: ""
permalink: /blog/:year/:month/:day/:title/
markdown: kramdown
exclude: [README.md, Gemfile, Gemfile.lock, node_modules]
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
# 검색 색인 (GitHub Pages 내장 지원 플러그인 — 설치 불필요)
plugins: [jekyll-seo-tag, jekyll-sitemap]
twitter: { card: summary_large_image }
# 날짜 처리: 한국 시간 기준, 미래 날짜 글도 빌드에 포함(시차로 글이 사라지는 사고 방지)
timezone: Asia/Seoul
future: true
